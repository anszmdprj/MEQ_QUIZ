<script>

'use strict';
const DATA=JSON.parse(document.getElementById('quiz-data').textContent);
const STORAGE_KEY='meq-edema-v1', THEME_KEY='meq-lab-theme';

const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.7 2.7 0 1 1 4.8 1.7c-1.4.9-2.1 1.1-2.1 3.1"/><path d="M12 17h.01"/>',moon:'<path d="M20.4 14.1A8.8 8.8 0 0 1 9.9 3.6 8.8 8.8 0 1 0 20.4 14.1Z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',flag:'<path d="M5 21V3m0 1c5-4 9 4 14 0v10c-5 4-9-4-14 0"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m8 10 4 4 4-4"/>',save:'<path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/>'};
const icon=name=>'<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">'+icons[name]+'</svg></span>';
$('#home-icon').innerHTML=icon('home');$('#help-icon').innerHTML=icon('help');$('#theme-icon').innerHTML=icon('moon');
let storageOK=true, state={version:DATA.version,sessions:{},lastCase:null}, view={screen:'home',caseId:null,index:null}, modalAction=null, toastTimer=null, patientCollapsed=false, reviewFilter='all';
try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s&&s.version===DATA.version&&s.sessions){state=s;validateStored();} const theme=localStorage.getItem(THEME_KEY);if(theme==='dark')document.documentElement.dataset.theme='dark';}catch(e){storageOK=false;state={version:DATA.version,sessions:{},lastCase:null};}
function validateStored(){for(const id of Object.keys(state.sessions)){const c=DATA.cases.find(c=>c.id===id),s=state.sessions[id];if(!c||!s||!s.answers||!s.order||!s.drafts||!s.flags){delete state.sessions[id];continue;}let valid=true,n=0;for(const q of c.questions){const ids=q.options.map(o=>o.id),order=s.order[q.id];if(!Array.isArray(order)||order.length!==ids.length||new Set(order).size!==ids.length||order.some(x=>!ids.includes(x))){valid=false;break;}if(s.answers[q.id]){if(n!==c.questions.indexOf(q)||!validPick(q,s.answers[q.id].ids)){valid=false;break;}n++;}if(s.drafts[q.id]&&(!Array.isArray(s.drafts[q.id])||s.drafts[q.id].some(x=>!ids.includes(x))))s.drafts[q.id]=[];}if(!valid){delete state.sessions[id];continue;}s.activeIndex=n;s.finishedAt=n===c.questions.length?(s.finishedAt||Date.now()):null;s.elapsedMs=Math.max(0,Number(s.elapsedMs)||0);}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;}catch(e){if(storageOK)toast('이 환경에서는 자동저장이 제한됩니다. 창을 닫기 전에 결과를 저장해 주세요.');storageOK=false;}}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){let r;try{const u=new Uint32Array(1);crypto.getRandomValues(u);r=u[0]/4294967296;}catch(e){r=Math.random();}const j=Math.floor(r*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newSession(c){const order={};for(const q of c.questions){order[q.id]=q.groups?q.groups.flatMap(g=>shuffle(q.options.filter(o=>o.group===g.id).map(o=>o.id))):shuffle(q.options.map(o=>o.id));}return{caseId:c.id,startedAt:Date.now(),finishedAt:null,elapsedMs:0,activeIndex:0,answers:{},drafts:{},flags:{},order};}
function caseBy(id){return DATA.cases.find(c=>c.id===id);}
function validPick(q,ids){if(!Array.isArray(ids)||ids.length!==q.pick||new Set(ids).size!==q.pick)return false;if(ids.some(id=>!q.options.some(o=>o.id===id)))return false;return !q.groups||q.groups.every(g=>ids.filter(id=>q.options.find(o=>o.id===id).group===g.id).length===g.pick);}
function keys(q){return q.acceptedSets||[q.options.filter(o=>o.correct).map(o=>o.id)];}
function grade(q,ids=[]){const sets=keys(q);const key=sets.reduce((a,b)=>b.filter(x=>ids.includes(x)).length>a.filter(x=>ids.includes(x)).length?b:a,sets[0]);const hits=ids.filter(x=>key.includes(x));return{key,hits,wrong:ids.filter(x=>!key.includes(x)),missing:key.filter(x=>!ids.includes(x)),score:q.points*hits.length/q.pick,full:hits.length===q.pick,alternates:[...new Set(sets.flat())].filter(x=>!key.includes(x))};}
function scoreCase(c,s){const g=c.questions.map(q=>grade(q,s.answers[q.id]?.ids||[]));return{grades:g,total:g.reduce((a,b)=>a+b.score,0),hits:g.reduce((a,b)=>a+b.hits.length,0),full:g.filter(g=>g.full).length};}
const fmt=n=>Number.isInteger(Math.round(n*100)/100)?String(Math.round(n*100)/100):(Math.round(n*100)/100).toFixed(2).replace(/0$/,'');
function timeText(ms){const sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3300);}

function closeModal(){const d=$('#modal');if(d.open)d.close();modalAction=null;}
function start(id,fresh=false){const c=caseBy(id);if(!c)return;const old=state.sessions[id];if(old&&fresh){modal('처음부터 다시 풀까요?','<p>이 증례의 현재 답안과 결과를 새 회차로 교체합니다. 다른 증례의 기록은 유지됩니다.</p><p>완료한 결과가 필요하면 먼저 결과 화면에서 텍스트 파일로 저장해 주세요.</p>','새 회차 시작',()=>begin(c,true));return;}begin(c,false);}
function begin(c,fresh){if(!state.sessions[c.id]||fresh)state.sessions[c.id]=newSession(c);state.lastCase=c.id;const s=state.sessions[c.id];view=s.finishedAt?{screen:'result',caseId:c.id,index:null}:{screen:'exam',caseId:c.id,index:s.activeIndex};patientCollapsed=false;reviewFilter='all';save();render();scrollTop();}
function render(){clearTimeout(toastTimer);$('#toast').classList.remove('visible');const bar=$('#submitbar');bar.hidden=view.screen!=='exam';if(view.screen==='home')renderHome();else if(view.screen==='exam')renderExam();else renderResult();}
function storageNotice(){return storageOK?'':'<div class="notice warn save-alert">현재 브라우저에서 자동저장을 사용할 수 없습니다. 창을 닫으면 진행 상황이 사라질 수 있습니다. 완료 후 결과 파일을 저장해 주세요.</div>';}

 const cards=DATA.cases.map(c=>{const s=state.sessions[c.id],finished=s?.finishedAt,score=finished?scoreCase(c,s):null;const desc=finished?'최근 완료 '+fmt(score.total)+' / 25점 · '+score.full+'/10문항 완전 정답':s?'진행 중 '+s.activeIndex+'/10문항 제출 · 이어서 풀 수 있습니다.':'아직 풀지 않은 새 증례';return '<article class="casecard panel"><div class="row between"><span class="casecode">CASE '+c.code+'</span><span class="pill">'+esc(c.patient)+'</span></div><h3>부종 변형 증례 '+c.code+'</h3><p>외래 초진 · 3단계 정보 공개<br>10문항 / 25점 · 보기 순서 무작위</p><div class="casebottom"><div class="recent">'+esc(desc)+'</div><div class="actions"><button class="btn primary grow" data-action="start" data-case="'+c.id+'">'+(finished?'결과·해설 보기':s?'이어서 풀기':'시험 시작')+icon('arrow')+'</button>'+(s?'<button class="btn" data-action="restart" data-case="'+c.id+'" aria-label="증례 '+c.code+' 처음부터 다시 풀기">다시 풀기</button>':'')+'</div></div></article>';}).join('');

function orderedOptions(q,s){return s.order[q.id].map(id=>q.options.find(o=>o.id===id));}
function renderExam(){const c=caseBy(view.caseId),s=state.sessions[c.id];if(s.finishedAt){view.screen='result';render();return;}const ix=Math.min(view.index??s.activeIndex,s.activeIndex),q=c.questions[ix],locked=ix<s.activeIndex,ids=locked?s.answers[q.id].ids:(s.drafts[q.id]||[]);view.index=ix;
 const nav=c.questions.map((x,i)=>'<button class="'+(i===ix?'current ':i<s.activeIndex?'submitted ':'')+(s.flags[x.id]?'flagged':'')+'" data-action="qnav" data-index="'+i+'" '+(i>s.activeIndex?'disabled':'')+' aria-label="문항 '+x.label+(i<s.activeIndex?' 제출됨 · 읽기 전용':i===s.activeIndex?' 현재 문항':' 미공개')+'" '+(i===ix?'aria-current="step"':'')+'>'+x.label+'</button>').join('');
 const order=orderedOptions(q,s);
 function renderOption(o){const n=order.indexOf(o)+1,checked=ids.includes(o.id);return '<label class="option '+(checked?'selected ':'')+(locked?'readonly':'')+'" data-option-id="'+o.id+'"><input type="checkbox" name="answer" value="'+o.id+'" '+(checked?'checked ':'')+(locked?'disabled ':'')+' aria-label="보기 '+n+': '+esc(o.text)+'"><span class="opnum">'+String(n).padStart(2,'0')+'</span><span class="optext">'+esc(o.text)+'</span></label>';}

 const stageNames=['I. 주증상','II. 병력','III. 진찰·검사'];

function updateSelection(){if(view.screen!=='exam')return;const c=caseBy(view.caseId),s=state.sessions[c.id],q=c.questions[view.index],locked=view.index<s.activeIndex,ids=locked?s.answers[q.id].ids:s.drafts[q.id]||[];$('#selection-count').textContent=(locked?'제출 ':'선택 ')+ids.length+' / '+q.pick;$('#countpill').textContent=ids.length;const okay=validPick(q,ids),remaining=q.pick-ids.length;$('#selection-help').textContent=locked?'잠긴 답안 · 정답은 종료 후 공개':okay?'선택 완료 · 제출 후 수정 불가':q.groups?'각 범주에서 하나씩 선택하세요.':remaining+'개를 더 선택해 주세요.';const b=$('#submit-answer');if(b)b.disabled=!okay;document.querySelectorAll('#options input').forEach(el=>{el.closest('.option').classList.toggle('selected',el.checked);});}
function changeOption(el){const c=caseBy(view.caseId),s=state.sessions[c.id],q=c.questions[view.index];if(view.index!==s.activeIndex)return;const ids=(s.drafts[q.id]||[]).slice(),id=el.value;if(el.checked){if(ids.length>=q.pick){el.checked=false;toast('이미 '+q.pick+'개를 선택했습니다. 다른 보기를 해제한 뒤 선택해 주세요.');return;}const o=q.options.find(x=>x.id===id);if(q.groups){const group=q.groups.find(g=>g.id===o.group);if(ids.filter(x=>q.options.find(z=>z.id===x).group===o.group).length>=group.pick){el.checked=false;toast('이 범주에서는 1개만 고를 수 있습니다. 기존 선택을 먼저 해제해 주세요.');return;}}ids.push(id);}else{const n=ids.indexOf(id);if(n>=0)ids.splice(n,1);}s.drafts[q.id]=ids;save();updateSelection();}
function submit(){const c=caseBy(view.caseId),s=state.sessions[c.id];if(view.index!==s.activeIndex||s.finishedAt)return;const q=c.questions[s.activeIndex],ids=s.drafts[q.id]||[];if(!validPick(q,ids)){toast('정해진 개수와 범주를 확인해 주세요.');return;}const order=orderedOptions(q,s);const preview=order.filter(o=>ids.includes(o.id)).map(o=>'<div class="selected-preview"><strong>'+String(order.indexOf(o)+1).padStart(2,'0')+'.</strong> '+esc(o.text)+'</div>').join('');modal('문항 '+q.label+' 답안을 확정할까요?','<div class="notice warn">확정하면 수정할 수 없습니다. 다음 정보가 공개되더라도 지금 선택한 답안은 그대로 채점됩니다.</div><div style="margin-top:12px">'+preview+'</div>',s.activeIndex===c.questions.length-1?'제출하고 채점':'확정하고 다음',()=>{if(s.activeIndex!==view.index||s.answers[q.id])return;s.answers[q.id]={ids:ids.slice(),submittedAt:Date.now()};delete s.drafts[q.id];s.activeIndex++;if(s.activeIndex===c.questions.length){s.finishedAt=Date.now();view={screen:'result',caseId:c.id,index:null};reviewFilter='all';}else{view.index=s.activeIndex;patientCollapsed=false;}save();render();scrollTop();});}
function sourceLinks(ids){return '<div class="sourcebar">참고 · '+ids.map(id=>'<a href="#source-'+id+'">['+id+']</a>').join('')+'</div>';}
function optionReview(o,g,selected,full=false){let cls='neutral',status='선택하지 않음';if(g.key.includes(o.id)){cls=selected?'hit':'miss';status=selected?'맞게 선택':'놓친 정답';}else if(selected){cls='wrong';status='잘못 선택 · '+o.tag;}else if(g.alternates.includes(o.id)){cls='alt';status='다른 인정 조합의 보기';}return '<div class="review-op '+cls+'"><span class="status">'+esc(status)+'</span><strong>'+esc(o.text)+'</strong><p>'+esc(o.why)+'</p></div>';}
function renderResult(){const c=caseBy(view.caseId),s=state.sessions[c.id];if(!s?.finishedAt){view={screen:'home'};render();return;}const score=scoreCase(c,s),groups=[['병력청취',['1']],['감별진단',['2']],['진단 근거',['3-1','3-2','3-3']],['진찰·검사',['4-1','4-2']],['기대소견',['5-1','5-2']],['최종 판단',['6']]];
 const breakHTML=groups.map(([name,labels])=>{let max=0,got=0;for(let i=0;i<c.questions.length;i++)if(labels.includes(c.questions[i].label)){max+=c.questions[i].points;got+=score.grades[i].score;}return '<div class="breakitem"><span>'+name+'</span><strong>'+fmt(got)+'</strong><small> / '+max+'</small><div class="meter"><i style="width:'+(got/max*100)+'%"></i></div></div>';}).join('');
 const wrongTags={};score.grades.forEach((g,i)=>g.wrong.forEach(id=>{const tag=c.questions[i].options.find(o=>o.id===id).tag;wrongTags[tag]=(wrongTags[tag]||0)+1;}));

 const reviewItems=c.questions.map((q,i)=>{const g=score.grades[i],selected=s.answers[q.id].ids,flag=s.flags[q.id],shown=reviewFilter==='all'||reviewFilter==='wrong'&&!g.full||reviewFilter==='flagged'&&flag;if(!shown)return'';const order=orderedOptions(q,s),relevant=order.filter(o=>g.key.includes(o.id)||selected.includes(o.id));return '<details class="reviewitem '+(g.full?'full':'partial')+'"><summary><span class="qreviewlabel">'+q.label+'</span><span class="reviewshort">'+esc(q.category)+(flag?' · 복습 표시':'')+'</span><span class="reviewpoints">'+fmt(g.score)+' / '+q.points+'점</span>'+icon('chevron')+'</summary><div class="reviewbody"><h4>'+esc(q.title)+'</h4><div class="muted" style="font-size:12px">18개 중 '+q.pick+'개 선택 · 정답 선택 '+g.hits.length+'/'+q.pick+'</div><div class="explanation">'+esc(q.explain)+'</div>'+relevant.map(o=>optionReview(o,g,selected.includes(o.id))).join('')+(q.acceptedSets?'<div class="notice info" style="margin-top:12px">이 문항은 두 가지 답안 조합을 인정합니다. 제출한 답안과 가장 잘 맞는 인정 조합으로 채점했습니다.</div>':'')+'<details class="full-options"><summary>전체 보기 18개와 해설 펼치기</summary>'+order.map(o=>optionReview(o,g,selected.includes(o.id),true)).join('')+'</details><details class="review-context"><summary>이 문항 당시 공개되었던 환자 정보</summary>'+patientHTML(c,q.stage)+'</details>'+sourceLinks(q.refs)+'</div></details>';}).join('');
 $('#main').innerHTML='<div class="screen result-screen">'+storageNotice()+'<div class="row between noprint" style="margin-bottom:15px"><span class="eyebrow">CASE '+c.code+' / REVIEW</span><button class="btn small" data-action="home">다른 증례 보기 '+icon('arrow')+'</button></div><section class="scorehero panel"><div><div class="eyebrow">YOUR SCORE</div><div class="scorebig">'+fmt(score.total)+'<small> / 25</small></div><div class="scoredetails">'+Math.round(score.total/25*100)+'% · '+score.full+'/10문항 완전 정답<br>정답 보기 '+score.hits+'/36개 · '+timeText(s.elapsedMs)+'</div></div><div><span class="pill blue">최종 진단 공개</span><h1 class="result-title">'+esc(c.resultTitle)+'</h1><p>'+esc(c.resultSummary)+'</p><div class="score-actions noprint"><button class="btn primary" data-action="export">'+icon('save')+'결과·오답 저장</button><button class="btn" data-action="print">인쇄</button><button class="btn" data-action="restart" data-case="'+c.id+'">다시 풀기</button></div></div></section><div class="notice">부분점수는 ‘문항 배점 × 맞게 선택한 개수 ÷ 요구 개수’입니다. 오답에 별도 감점은 없으며, 정해진 수만 제출할 수 있습니다. 실제 MEQ의 공식 채점 결과와는 다를 수 있습니다.</div><section class="breakdown" aria-label="유형별 점수">'+breakHTML+'</section><section class="learning-panel panel"><h3>이 증례에서 남길 세 가지</h3>'+c.lessons.map((l,i)=>'<div class="lesson"><b>0'+(i+1)+'</b><span>'+esc(l)+'</span></div>').join('')+sourceLinks(c.sourceIds.filter(id=>id!=='S1'))+(weakness?'<div class="mistake-tags" aria-label="오답 유형">'+weakness+'</div>':'<div class="notice info" style="margin-top:12px">모든 선택이 정답입니다. 다른 증례에서도 같은 추론 원칙을 적용해 보세요.</div>')+'</section><div class="review-heading"><h2>문항별 채점과 해설</h2><div class="review-controls"><button class="btn small '+(reviewFilter==='all'?'primary':'')+'" data-action="filter" data-filter="all">전체</button><button class="btn small '+(reviewFilter==='wrong'?'primary':'')+'" data-action="filter" data-filter="wrong">오답만</button><button class="btn small '+(reviewFilter==='flagged'?'primary':'')+'" data-action="filter" data-filter="flagged">복습 표시</button></div></div><section id="reviews">'+(reviewItems||'<div class="panel empty">현재 조건에 해당하는 문항이 없습니다.</div>')+'</section><section class="sources panel"><h3>출제 근거와 참고자료</h3><p class="muted" style="font-size:12px">수업 자료의 접근 순서를 바탕으로 새로 만든 가상 증례입니다. 아래 공개 자료는 핵심 검사 해석을 보완하는 데 사용했습니다. 확인일: 2026-10-13.</p>'+c.sourceIds.map(id=>{const x=DATA.sources.find(x=>x.id===id);return '<div class="source" id="source-'+x.id+'"><strong>['+x.id+'] '+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a>':esc(x.title))+'</strong><p>'+esc(x.detail)+'</p></div>';}).join('')+'</section><div class="endnotes">이 증례는 교육용 창작물입니다. 일부 선택지는 잘못된 주장 자체를 판별하도록 구성했습니다. 실제 환자에게 적용할 때에는 환자 상태와 진료 환경에 따라 검사와 우선순위가 달라집니다.</div></div>';
}
function help(){modal('이용 방법과 출제 방식','<p><strong>시험 흐름</strong><br>I. 주증상 → 병력청취 1문항<br>II. 병력 → 감별진단, 진단별 근거 3문항, 진찰·검사 계획, 기대소견<br>III. 진찰·검사 → 최종 판단</p><p><strong>선택과 잠금</strong><br>각 문항은 18개 보기에서 지정된 3개 또는 5개를 고릅니다. 확정 전까지는 자유롭게 변경할 수 있습니다. 제출한 문항은 위쪽 번호로 다시 볼 수 있지만 수정은 안 됩니다. 정답과 해설은 10문항을 모두 마친 뒤 공개합니다.</p><p><strong>원본과 달라진 점</strong><br>원본의 큰 문항 6개를 자동채점 가능한 10개 소문항으로 나눴습니다. 진단 근거 문항의 세 가설은 앞 답안과 독립적으로 고정했습니다. 원본 최종진단 단답형은 진단·근거·해석에서 각각 1개씩 선택하는 3개 선택형으로 바꿨습니다.</p><p><strong>채점</strong><br>원본의 4·3·6·4·6·2점을 소문항에 배분해 총 25점입니다. 부분점수 = 배점 × 정답 선택 수 ÷ 요구 수. 오답 별도 감점은 없습니다. 임상적으로 타당한 복수 조합이 있는 문항은 인정 조합 중 최고 점수로 채점합니다.</p><p><strong>저장과 재시작</strong><br>새 회차마다 보기 순서를 섞습니다. 같은 회차에서는 순서가 유지됩니다. 답안은 이 브라우저에만 저장되며 다른 기기로 자동 동기화되지 않습니다. 비공개 모드·파일 경로 변경·브라우저 설정에 따라 저장이 유지되지 않을 수 있습니다. 완료 결과는 텍스트 파일로 저장할 수 있습니다.</p><p><strong>오프라인 학습용</strong><br>네트워크 연결이나 로그인이 필요하지 않습니다. 참고자료 링크를 눌렀을 때만 외부 페이지가 열립니다. 정답 데이터는 파일 안에 있어 소스 열람을 막는 보안 시험 서비스는 아닙니다.</p>','확인',null,'');}
function exportResult(){const c=caseBy(view.caseId),s=state.sessions[c.id];if(!s?.finishedAt)return;const sc=scoreCase(c,s);let text='MEQ LAB · 부종 / 증례 '+c.code+'\n완료: '+new Date(s.finishedAt).toLocaleString('ko-KR')+'\n성적: '+fmt(sc.total)+'/25점 · 완전 정답 '+sc.full+'/10문항\n풀이 시간: '+timeText(s.elapsedMs)+'\n최종진단: '+c.resultTitle+'\n\n'+c.resultSummary+'\n\n[모든 환자 정보]\n'+[...c.intro,...c.history,...c.exam,...c.labs.map(([a,b])=>a+': '+b)].join('\n\n')+'\n\n';c.questions.forEach((q,i)=>{const g=sc.grades[i],selected=s.answers[q.id].ids; text+='='.repeat(45)+'\n문항 '+q.label+' · '+q.title+'\n점수 '+fmt(g.score)+'/'+q.points+' · '+q.pick+'개 선택\n';text+='내 답안:\n'+orderedOptions(q,s).filter(o=>selected.includes(o.id)).map(o=>' - '+o.text).join('\n')+'\n인정 정답(가장 가까운 조합):\n'+q.options.filter(o=>g.key.includes(o.id)).map(o=>' - '+o.text).join('\n')+'\n해설: '+q.explain+'\n';for(const id of [...g.wrong,...g.missing]){const o=q.options.find(o=>o.id===id);text+=(g.wrong.includes(id)?'[잘못 선택] ':'[놓친 정답] ')+o.text+'\n'+o.why+'\n';}text+='\n';});text+='[참고자료]\n'+c.sourceIds.map(id=>{const x=DATA.sources.find(x=>x.id===id);return '['+id+'] '+x.title+'\n'+x.detail+(x.url?'\n'+x.url:'');}).join('\n\n')+'\n\n교육용 가상 증례이며 공식 시험·채점표 또는 실제 진료 지침을 대신하지 않습니다.\n';download('MEQ_부종_증례'+c.code+'_결과.txt','\ufeff'+text,'text/plain;charset=utf-8');}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function printResult(){if(view.screen!=='result')return;const ds=[...document.querySelectorAll('.reviewitem')],before=ds.map(d=>d.open);ds.forEach(d=>d.open=true);const cleanup=()=>{ds.forEach((d,i)=>d.open=before[i]);window.removeEventListener('afterprint',cleanup);};window.addEventListener('afterprint',cleanup);window.print();}
function toggleTheme(){const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem(THEME_KEY,theme);}catch(e){}}
document.addEventListener('change',e=>{if(e.target.matches('#options input[type=checkbox]'))changeOption(e.target);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;if(a==='home'){save();view={screen:'home',caseId:null,index:null};render();scrollTop();}else if(a==='help')help();else if(a==='theme')toggleTheme();else if(a==='start')start(el.dataset.case);else if(a==='restart')start(el.dataset.case,true);else if(a==='random'){const unfinished=DATA.cases.filter(c=>!state.sessions[c.id]?.finishedAt);const pool=unfinished.length?unfinished:DATA.cases;const c=pool[Math.floor(Math.random()*pool.length)];start(c.id,!unfinished.length);}else if(a==='qnav'){const i=Number(el.dataset.index),s=state.sessions[view.caseId];if(Number.isInteger(i)&&i<=s.activeIndex){view.index=i;patientCollapsed=false;render();scrollTop();}}else if(a==='current'){view.index=state.sessions[view.caseId].activeIndex;render();scrollTop();}else if(a==='patient-toggle'){patientCollapsed=!patientCollapsed;document.querySelector('.patientcontent').classList.toggle('mobile-collapsed',patientCollapsed);el.setAttribute('aria-expanded',String(!patientCollapsed));el.textContent=patientCollapsed?'정보 펼치기':'정보 접기';}else if(a==='clear'){const c=caseBy(view.caseId),s=state.sessions[c.id];if(view.index!==s.activeIndex)return;const q=c.questions[view.index];s.drafts[q.id]=[];document.querySelectorAll('#options input').forEach(e=>e.checked=false);save();updateSelection();}else if(a==='flag'){const c=caseBy(view.caseId),s=state.sessions[c.id],q=c.questions[view.index];s.flags[q.id]=!s.flags[q.id];save();el.setAttribute('aria-pressed',String(s.flags[q.id]));el.innerHTML=icon('flag')+(s.flags[q.id]?'복습 표시됨':'복습 표시');const n=document.querySelector('.qnav [data-index="'+view.index+'"]');if(n)n.classList.toggle('flagged',!!s.flags[q.id]);}else if(a==='submit')submit();else if(a==='modal-close')closeModal();else if(a==='modal-accept'){const f=modalAction;closeModal();if(f)f();}else if(a==='filter'){reviewFilter=el.dataset.filter;const y=window.scrollY;renderResult();window.scrollTo({top:y,behavior:'instant'});}else if(a==='export')exportResult();else if(a==='print')printResult();});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&view.screen==='exam'&&!$('#modal').open){e.preventDefault();submit();}});
$('#modal').addEventListener('cancel',()=>modalAction=null);
let lastTick=performance.now(),saveTicks=0;
setInterval(()=>{const now=performance.now(),dt=Math.min(now-lastTick,2000);lastTick=now;if(view.screen==='exam'&&!document.hidden){const s=state.sessions[view.caseId];if(s&&!s.finishedAt){s.elapsedMs+=dt;const node=$('#elapsed');if(node)node.textContent=timeText(s.elapsedMs);if(++saveTicks%10===0)save();}}},1000);
document.addEventListener('visibilitychange',()=>{lastTick=performance.now();if(document.hidden)save();});
window.addEventListener('pagehide',save);
render();
})();
</script>
